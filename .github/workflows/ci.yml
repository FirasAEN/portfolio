# Checks that must pass BEFORE anything deploys.
#
# deploy.yml runs on pushes to `dev`, which is also the deploy branch — so by
# the time it fails, it has already failed in production. This runs on pull
# requests, where a failure is still cheap.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both targets, because they differ in base path and canonical host and
      # only one of them is exercised by the test suite.
      - name: Build (VPS)
        run: npm run build
        env:
          DEPLOY_TARGET: vps

      - name: Build (GitHub Pages)
        run: npm run build
        env:
          DEPLOY_TARGET: pages

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
