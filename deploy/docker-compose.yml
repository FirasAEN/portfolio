# Portfolio — static CV site. Public, stateless, no volumes.
#
# Lives in the app repo rather than alongside the other self-hosted apps,
# because unlike them this one is BUILT rather than pulled: there is no
# published image, so the compose file has to sit next to the source it builds.
# The checkout IS the deploy directory — /opt/apps/portfolio is this repo.
#
# The hostname is a BUILD arg, not a runtime env var. A static site bakes its
# origin into every page — canonical, og: tags, sitemap, JSON-LD — so changing
# it means rebuilding the image, not restarting the container. DEPLOY_TARGET
# selects the host; see TARGETS in astro.config.mjs.
name: portfolio

services:
  portfolio:
    build:
      # The repo root, one level up from this file.
      context: ..
      args:
        DEPLOY_TARGET: vps
    image: portfolio:local
    container_name: portfolio
    restart: unless-stopped
    # Without this the container is "up" the moment nginx starts, even if it is
    # serving nothing. wget is in the nginx alpine image already, so this needs
    # no extra layer.
    #
    # 127.0.0.1, NOT localhost. nginx listens on 0.0.0.0:80 — IPv4 only — while
    # localhost resolves to ::1 first, so the check was refused every time. That
    # marks the container unhealthy, and Traefik's Docker provider will not route
    # to an unhealthy container: the site returned Traefik's own 404 while nginx
    # was serving perfectly well behind it. A healthcheck that lies is worse than
    # none, because it takes the site down on its own.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`firas-aen.portfolio.cyberonix.dev`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=le"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
      # NO auth middleware, deliberately. Other apps on this host gate behind
      # SSO; copying those labels would put a login in front of a public CV.
    networks:
      - web

networks:
  # The shared Traefik network, created outside this file.
  web:
    external: true
