server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and is the only thing that talks to this container,
    # so no redirect or certificate handling belongs here.

    # NOTE ON add_header: a location that sets ANY add_header discards every
    # add_header inherited from the server block. So the security headers are
    # repeated in each location below rather than declared once up here — that
    # looks redundant and is not. Dropping a repeat silently drops the header.

    # Astro builds with trailingSlash: 'ignore', so /work/keycloak and
    # /work/keycloak/ must both resolve. $uri.html covers flat pages
    # (404.html), $uri/index.html the directory routes.
    #
    # =404 rather than a rewrite to /404.html: error_page below serves that page
    # WITH a 404 status, where a rewrite returns it as 200 and invites crawlers
    # to index every broken URL as a real page.
    location / {
        try_files $uri $uri.html $uri/index.html =404;

        # Pages must revalidate, or a deploy stays invisible until the browser
        # decides otherwise. This belongs here and not on a `\.html$` location:
        # the URI for the home page is "/", which no .html pattern ever matches
        # — index.html is only resolved internally.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Astro content-hashes everything under /_astro/, so a filename changes
    # whenever its contents do and can be cached indefinitely.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    access_log off;
}
