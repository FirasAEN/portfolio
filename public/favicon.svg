<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Firas François">
  <!--
    A hexagon: ports and adapters, the architecture this site is largely about.
    Solid plate rather than a bare glyph so the mark holds its own against both
    light and dark browser chrome, and stays legible at 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#0e7490"/>
  <path d="M16 6.5 24 11.25 24 20.75 16 25.5 8 20.75 8 11.25 Z"
        fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="2.6" fill="#ffffff"/>
</svg>
