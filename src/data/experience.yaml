        - Prototyped a drag-and-drop studio for composing read-only business UIs from API calls, and recorded the security boundary it deferred rather than claiming it shipped
        - Build and run my own developer tooling — code-generation scripts, test scaffolding and documentation generators — driven by Claude Code with custom agents and MCP integrations
        - Use the same pipeline for prototyping and architectural exploration, keeping architecture, domain modelling and production-critical decisions under human ownership
        - Evaluate AI tooling on the code quality, maintainability and correctness it produces, not on output volume
        - Run personal and professional applications on a self-managed Hostinger VPS — Linux, deployment, domains, DNS, SSL/TLS and server configuration
        - Automate deployment and maintenance with scripting and CI/CD workflows
  stack:
    - Linux
    - Docker
    - CI/CD
    - Bash
    - Python
    - Claude Code
    - MCP

