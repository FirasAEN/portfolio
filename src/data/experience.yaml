  summary: >-
    Leading a team of 5 on DataChain®, a European sovereign data platform. Four
    years moving new services off an inherited Java monolith onto DDD and
    Hexagonal boundaries, and building the tooling the platform's business users
    work in daily — a visual composer for automation workflows and an IDE-style
    editor for the formulas Spark evaluates over their data. In production at
