- id: independent
  company: Independent Engineering & Self-Hosting
  short: Independent
  role: Personal projects
  location: Remote
  start: 2024-01-01
  end: null # current
  accent: var(--accent-regular)
  summary: >-
    Building and self-hosting my own systems — a healthcare scheduling platform, a
    Spark/Kafka job execution engine, a knowledge-vault reader, and two different
    answers to multi-tenancy — alongside AI-assisted developer tooling. Where the
    architectural decisions are mine end to end, and the reasoning is written down
    next to the code.
  highlights:
    - group: Tooling & infrastructure
      items:
        - "Built two production-shaped answers to multi-tenancy a week apart: row-level security retrofitted onto a 27-model schema already carrying data, and greenfield schema-per-tenant on Hibernate 7 — both fail-closed by construction"
